<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Vizor — workspace</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="stylesheet" href="guard-card.css" />
  </head>
  <body data-inspector-width="compact">
    <header id="topbar"></header>
    <main id="columns">
      <aside id="maestro-orchestra" class="maestro-only" aria-label="Orquestra"></aside>
      <nav id="sidebar" aria-label="Projetos"></nav>
      <section class="pane" id="terminal-pane">
        <div class="pane-bar" id="tabs"></div>
        <div id="term-host"></div>
        <div class="placeholder" id="term-placeholder"></div>
        <div id="new-menu" hidden></div>
        <div id="guard-asks" class="guard-asks" hidden></div>
      </section>
      <aside class="pane" id="inspector" aria-label="Mudanças">
        <div class="pane-bar" id="inspector-head"></div>
        <div id="task-picker"></div>
        <div id="timeline"></div>
        <div id="maestro-order" class="maestro-only"></div>
        <div id="maestro-balloon" class="maestro-only"></div>
        <div id="detail"></div>
        <div id="maestro-consequences" class="maestro-only"></div>
        <div id="rail"></div>
        <div id="composer" hidden></div>
      </aside>
      <aside id="maestro-impact" class="maestro-only" aria-label="Área de impacto"></aside>
    </main>
    <script type="module" src="workspace.js"></script>
  </body>
</html>
